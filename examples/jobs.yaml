# backup v0.2

Eine zweite Iteration eines modularen Backup-Tools für Linux.

## Funktionen

- Dateisystem-Backups mit rsync
- SQL-Dump-Adapter für PostgreSQL/MySQL/SQLite
- Include-/Exclude-Muster pro Quelle
- Retention-Policy (daily/weekly/monthly)
- pluggable Notifier (E-Mail, Desktop)
- Restore-Befehl als Grundgerüst
- vorbereitete Struktur für SSH-Quellen und pCloud-Backend

## Architektur

- backup_tool/models.py: Datamodelle
- backup_tool/sources.py: Source-Adapter
- backup_tool/runner.py: Backup-Lauf mit Snapshot und Notifications
- backup_tool/retention.py: Simple retention management
- backup_tool/restore.py: Restore-Funktion
- backup_tool/scheduler.py: Scheduler-Wrapper
- backup_tool/notifiers.py: E-Mail/Desktop-Notifier

## Beispiel-Konfiguration

```yaml
jobs:
  - id: home-files
    name: Home Files
    source_type: filesystem
    source_path: /home/user
    destination: /var/backups/home-files
    source_excludes:
      - .cache
      - node_modules
      - tmp/**
      - Downloads/temp/**
    source_includes:
      - "*.txt"
    retention:
      daily: 7
      weekly: 4
      monthly: 12
    notifiers:
      - type: email
        to: admin@example.com
        on: [success, failure]
      - type: desktop
        on: [success, failure]

  - id: app-db
    name: App Database
    source_type: postgres
    source_path: appdb
    destination: /var/backups/app-db
    retention:
      daily: 7
      weekly: 4
      monthly: 12
    notifiers:
      - type: email
        to: admin@example.com
        on: [failure]
```

## Nutzung

Installieren:

```bash
python -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
```

Jobs anzeigen:

```bash
python -m backup_tool.main list --config examples/jobs.yaml
```

Einzelnen Job ausführen:

```bash
python -m backup_tool.main run --config examples/jobs.yaml --job home-files --repo-root /var/backups/store
```

Snapshot wiederherstellen:

```bash
python -m backup_tool.main restore --config examples/jobs.yaml --snapshot /var/backups/store/snapshots/home-files/20261031_120000 --target /tmp/restore
```

## Hinweise

- Für Dateisystem-Backups muss `rsync` installiert sein.
- Für SQL-Dumps müssen die jeweiligen DB-Tools installiert sein (`pg_dump`, `mysqldump`, `sqlite3`).
- pCloud ist in dieser Version als bewusstes Stub-Backend enthalten; die echte Integration folgt in einer späteren Version.
- SSH-Quellen sind vorbereitet, aber die volle Remote-Transport-Implementierung wird in einem späteren Schritt ergänzt.
- Die Notifier laufen nur, wenn die Umgebung dafür geeignet ist (z. B. GUI für Desktop-Notifications, SMTP-Konfiguration für E-Mail).
