from __future__ import annotations

import os
import shutil
import subprocess
import time
from datetime import datetime
from pathlib import Path

from .models import BackupResult, JobConfig, NotifierConfig
from .notifiers import build_notifier


def _maybe_apply_include_exclude(job: JobConfig, command: list[str]) -> list[str]:
    """Add rsync include/exclude patterns to the command."""
    for pattern in job.source_excludes or []:
        command += ["--exclude", pattern]
    for pattern in job.source_includes or []:
        command += ["--include", pattern]
    return command


class SourceAdapter:
    """Base class for all source adapters."""

    def create_snapshot(self, job: JobConfig, snapshot_dir: Path) -> dict:
        raise NotImplementedError


class FilesystemSource(SourceAdapter):
    """Back up a directory tree using rsync."""

    def create_snapshot(self, job: JobConfig, snapshot_dir: Path) -> dict:
        source_path = Path(job.source_path)
        if not source_path.exists():
            raise FileNotFoundError(f"Source does not exist: {source_path}")

        rsync_bin = shutil.which("rsync")
        if not rsync_bin:
            raise FileNotFoundError("rsync is not installed or not in PATH")

        command = [rsync_bin, "-a", "--delete"]
        command = _maybe_apply_include_exclude(job, command)
        command += [f"{source_path.as_posix()}/", str(snapshot_dir)]

        completed = subprocess.run(command, capture_output=True, text=True)
        if completed.returncode != 0:
            raise RuntimeError(completed.stderr or completed.stdout or "rsync failed")

        file_count = sum(1 for _ in snapshot_dir.rglob("*") if _.is_file())
        return {
            "source_type": "filesystem",
            "file_count": file_count,
            "excluded_patterns": job.source_excludes,
            "included_patterns": job.source_includes,
            "created_at": datetime.utcnow().isoformat(timespec="seconds") + "Z",
        }


class SqlDumpSource(SourceAdapter):
    """Create a dump for common relational database tools."""

    def create_snapshot(self, job: JobConfig, snapshot_dir: Path) -> dict:
        name = job.source_path or "dump"
        dump_path = snapshot_dir / f"{name}.sql"
        dump_path.parent.mkdir(parents=True, exist_ok=True)

        source_type = job.source_type.lower()
        if source_type == "postgres":
            tool = shutil.which("pg_dump")
            if not tool:
                raise FileNotFoundError("pg_dump is not installed or not in PATH")
            cmd = [tool, "--file", str(dump_path), job.source_path]
        elif source_type == "mysql":
            tool = shutil.which("mysqldump")
            if not tool:
                raise FileNotFoundError("mysqldump is not installed or not in PATH")
            cmd = [tool, job.source_path, "--result-file", str(dump_path)]
        elif source_type == "sqlite":
            tool = shutil.which("sqlite3")
            if not tool:
                raise FileNotFoundError("sqlite3 is not installed or not in PATH")
            cmd = [tool, job.source_path, ".backup", str(dump_path)]
        else:
            raise ValueError(f"Unsupported SQL source type: {job.source_type}")

        completed = subprocess.run(cmd, capture_output=True, text=True)
        if completed.returncode != 0:
            raise RuntimeError(completed.stderr or completed.stdout or "SQL dump failed")

        return {
            "source_type": job.source_type,
            "dump_path": str(dump_path),
            "created_at": datetime.utcnow().isoformat(timespec="seconds") + "Z",
        }


class PCloudSource(SourceAdapter):
    """Stub for future pCloud integration."""

    def create_snapshot(self, job: JobConfig, snapshot_dir: Path) -> dict:
        raise NotImplementedError(
            "pCloud support is not implemented yet. Use filesystem/SQL adapters or add a dedicated cloud adapter."
        )


def create_source(job: JobConfig) -> SourceAdapter:
    source_type = (job.source_type or "").lower()
    if source_type == "filesystem":
        return FilesystemSource()
    if source_type in {"postgres", "mysql", "sqlite"}:
        return SqlDumpSource()
    if source_type == "pcloud":
        return PCloudSource()
    raise ValueError(f"Unsupported source type: {job.source_type}")


class BackupRunner:
    def __init__(self, repo_root: str | Path):
        self.repo_root = Path(repo_root)
        self.repo_root.mkdir(parents=True, exist_ok=True)

    def _snapshot_dir_for(self, job: JobConfig) -> Path:
        timestamp = datetime.utcnow().strftime("%Y%m%d_%H%M%S")
        snapshot_root = self.repo_root / "snapshots" / job.id
        snapshot_root.mkdir(parents=True, exist_ok=True)
        return snapshot_root / timestamp

    def run_job(self, job: JobConfig) -> BackupResult:
        started = time.time()
        started_at = datetime.utcnow().isoformat(timespec="seconds") + "Z"
        snapshot_dir = self._snapshot_dir_for(job)
        snapshot_dir.mkdir(parents=True, exist_ok=True)

        try:
            source = create_source(job)
            metadata = source.create_snapshot(job, snapshot_dir)

            manifest = {
                "job_id": job.id,
                "job_name": job.name,
                "source_type": job.source_type,
                "destination": str(snapshot_dir),
                "created_at": started_at,
                "metadata": metadata,
            }
            (snapshot_dir / "manifest.json").write_text(__import__("json").dumps(manifest, indent=2), encoding="utf-8")

            finished = time.time()
            result = BackupResult(
                job_id=job.id,
                status="success",
                snapshot_path=str(snapshot_dir),
                started_at=started_at,
                finished_at=datetime.utcnow().isoformat(timespec="seconds") + "Z",
                duration_seconds=finished - started,
                message=f"Backup successful for {job.name}",
                metadata=metadata,
            )
        except Exception as exc:  # pragma: no cover - real-world failure path
            finished = time.time()
            result = BackupResult(
                job_id=job.id,
                status="failed",
                snapshot_path=None,
                started_at=started_at,
                finished_at=datetime.utcnow().isoformat(timespec="seconds") + "Z",
                duration_seconds=finished - started,
                message=f"Backup failed for {job.name}: {exc}",
                metadata={"error": str(exc)},
            )

        self._dispatch_notifications(job, result)
        return result

    def _dispatch_notifications(self, job: JobConfig, result: BackupResult) -> None:
        for notifier_config in job.notifiers:
            notifier = build_notifier(notifier_config.__dict__)
            if not notifier:
                continue
            if result.status in notifier_config.on:
                notifier.send({
                    "job_id": job.id,
                    "job_name": job.name,
                    "status": result.status,
                    "message": result.message,
                })


def load_jobs_from_config(config_path: str | os.PathLike[str]) -> list[JobConfig]:
    import yaml

    raw = yaml.safe_load(Path(config_path).read_text(encoding="utf-8")) or {}
    jobs_data = raw.get("jobs", [])

    jobs: list[JobConfig] = []
    for item in jobs_data:
        notifiers = []
        for raw_notifier in item.get("notifiers", []):
            notifiers.append(
                NotifierConfig(
                    type=raw_notifier.get("type", "email"),
                    on=raw_notifier.get("on", ["success", "failure"]),
                    to=raw_notifier.get("to"),
                    subject=raw_notifier.get("subject"),
                    title=raw_notifier.get("title"),
                )
            )
        jobs.append(
            JobConfig(
                id=item["id"],
                name=item.get("name", item["id"]),
                source_type=item.get("source_type", "filesystem"),
                source_path=item.get("source_path", "."),
                destination=item.get("destination", "."),
                notifiers=notifiers,
                schedule=item.get("schedule"),
                transport=item.get("transport", "local"),
                remote_host=item.get("remote_host"),
                remote_user=item.get("remote_user"),
                source_excludes=item.get("source_excludes") or item.get("excludes") or item.get("exclude") or [],
                source_includes=item.get("source_includes") or item.get("includes") or item.get("include") or [],
            )
        )
    return jobs


def main() -> None:
    import argparse

    parser = argparse.ArgumentParser(description="Modular backup tool")
    parser.add_argument("action", choices=["run", "list"], help="Action to execute")
    parser.add_argument("--config", required=True, help="Path to the YAML job definition file")
    parser.add_argument("--job", help="Optional job id to run only one job")
    parser.add_argument("--repo-root", default="./.backup_store", help="Directory where snapshots are stored")
    args = parser.parse_args()

    jobs = load_jobs_from_config(args.config)

    if args.action == "list":
        for job in jobs:
            print(f"{job.id}: {job.name} [{job.source_type}]")
        return

    if args.action == "run":
        runner = BackupRunner(args.repo_root)
        selected_jobs = jobs if not args.job else [job for job in jobs if job.id == args.job]
        if not selected_jobs:
            raise SystemExit(f"No job found matching id: {args.job}")

        for job in selected_jobs:
            result = runner.run_job(job)
            print(f"{job.id}: {result.status} -> {result.message}")


if __name__ == "__main__":
    main()
