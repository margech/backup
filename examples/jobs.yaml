# Beispiel-Jobdatei für v0.3
# source_excludes und source_includes gelten für lokale oder SSH-Dateisystem-Quellen.

jobs:
  - id: home-files
    name: Home Files
    source_type: filesystem
    source_path: /home/user
    destination: /var/backups/home-files
    transport: local
    source_excludes:
      - .cache
      - node_modules
      - tmp/**
    source_includes:
      - "*.txt"
    retention:
      daily: 7
      weekly: 4
      monthly: 12
    notifiers:
      - type: email
        to: admin@example.com
        on: [success, failure]
      - type: desktop
        on: [success, failure]

  - id: remote-db
    name: Remote Database
    source_type: postgres
    source_path: appdb
    destination: /var/backups/remote-db
    transport: ssh
    remote_host: db01.example.com
    remote_user: backupuser
    retention:
      daily: 7
      weekly: 4
      monthly: 12
    notifiers:
      - type: email
        to: admin@example.com
        on: [failure]

  - id: remote-files
    name: Remote Files
    source_type: ssh
    source_path: /srv/files
    destination: /var/backups/remote-files
    transport: ssh
    remote_host: backup01.example.com
    remote_user: backupuser
    source_excludes:
      - cache/**
    retention:
      daily: 7
      weekly: 4
      monthly: 12

  - id: pcloud-docs
    name: pCloud Documents
    source_type: pcloud
    cloud_remote: pcloud
    cloud_path: /Documents
    destination: /var/backups/pcloud-docs
    retention:
      daily: 7
      weekly: 4
      monthly: 12
